# Builds "Minecraft Biogaming.app" as a .dmg for Apple Silicon and Intel Macs.
#
#   - every push to main / pull request touching the app: build + test, .dmg kept as a
#     workflow artifact (Actions tab > run > Artifacts) for 14 days
#   - pushing a tag like v0.2.0: also attaches both .dmg files to a GitHub Release
#   - or run it by hand: Actions > Build Mac app > Run workflow
name: Build Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mcbio/**", "profiles/**", "packaging/**", "scripts/download_models.py",
            "requirements.txt", ".github/workflows/build-mac.yml"]
  pull_request:
    paths: ["mcbio/**", "profiles/**", "packaging/**", "scripts/download_models.py",
            "requirements.txt", ".github/workflows/build-mac.yml"]
  workflow_dispatch:

permissions:
  contents: write          # only used to attach .dmg files to a tagged release

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # arm64
            arch: apple-silicon
          - runner: macos-15-intel    # x86_64 (GitHub supports Intel macOS until fall 2027)
            arch: intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "MCBIO_VERSION=$V" >> "$GITHUB_ENV"
          echo "version $V on $(uname -m)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-mac-${{ matrix.arch }}.txt
          python -m pip list | grep -i -E "mediapipe|opencv|numpy|pyinstaller|pynput|pyobjc"

      - name: Download MediaPipe models
        run: python scripts/download_models.py

      - name: Unit tests
        run: python -m pytest -q

      - name: Build the app
        run: pyinstaller --noconfirm packaging/mcbio.spec

      - name: Smoke-test the packaged app
        run: |
          BIN="dist/Minecraft Biogaming.app/Contents/MacOS/Minecraft Biogaming"
          "$BIN" --self-test
          "$BIN" --synthetic --dry-run --no-hud --frames 90 --quiet

      - name: Make the .dmg
        run: bash packaging/make_dmg.sh "$MCBIO_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Biogaming-mac-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 14

      - name: Attach to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: packaging/HOW_TO_OPEN.txt
